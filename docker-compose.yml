services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qalahub
      POSTGRES_USER: qalahub
      POSTGRES_PASSWORD: qalahub
    ports:
      - "5432:5432"
    volumes:
      - qalahub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalahub -d qalahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - qalahub_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qalahub_postgres:
  qalahub_redis:
